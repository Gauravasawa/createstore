name: Docs

# Builds and checks the documentation site on every change, and deploys it to Cloudflare Pages
# (Direct Upload: Cloudflare never builds our code). See .github/docs-hosting-decision.md.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/docs.yml', 'package-lock.json']
  pull_request:
    paths: ['site/**', '.github/workflows/docs.yml', 'package-lock.json']
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  # A newer pull-request push replaces an older preview; a production deploy is never cut off halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx --no-install playwright-core install --with-deps chromium
      - name: Build the site
        env:
          # Set the repository variable DOCS_URL to the site address (see .github/setup-checklist.md)
          SITE_URL: ${{ vars.DOCS_URL || 'http://localhost:8788' }}
          DOCS_ENV: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
        run: npm run docs:build
      # Security headers, no third-party requests, every reference resolves, SEO files
      - run: npm run docs:check
      # The real page in a real browser under the real Content-Security-Policy
      - run: npm run docs:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    # Waits until both repository variables exist, and never runs for pull requests from forks (they get no secrets)
    if: >-
      vars.DOCS_URL != '' && vars.CLOUDFLARE_PROJECT != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The Cloudflare credentials live in this environment only, not in the repository secrets
    environment: docs
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site-dist
      - name: Deploy
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.2 # pinned, and over a week old when chosen
          # main is the production branch; every pull request gets its own preview as pr-<number>
          command: >-
            pages deploy site-dist
            --project-name=${{ vars.CLOUDFLARE_PROJECT }}
            --branch=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'main' }}
            --commit-hash=${{ github.sha }}
            --commit-dirty=true
      - name: Show the address
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          {
            echo "### Documentation deployed"
            echo "- Deployment: $URL"
            echo "- Branch alias: ${ALIAS:-none}"
          } >> "$GITHUB_STEP_SUMMARY"
