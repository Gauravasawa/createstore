name: Release

# semantic-release creates the version tag, so tags are the output of this workflow, never its trigger
# (a tag trigger would loop). Only branches listed in release.config.mjs can release; any other push is a no-op.
on:
  push:
    branches:
      - main
      - next
      - beta
      - alpha
      - '[0-9]+.x'
      - '[0-9]+.[0-9]+.x'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (decide the version and check credentials; publish nothing)
        type: boolean
        default: true

permissions: {}

# Never cancel a release that is already running: a half-finished publish is the worst outcome.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Publish only a commit CI passed: every Node version, Windows, macOS and the real browsers, which the release job
  # does not run itself. Waits up to 20 minutes for CI to finish. Manual dry runs don't wait. A commit whose CI was
  # cancelled because a newer push to the branch replaced it is skipped, not failed: the newer commit's run releases.
  ci-gate:
    name: Wait for CI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      actions: read # the CI result of this commit
      contents: read # the branch's current commit
    outputs:
      release: ${{ steps.wait.outputs.release }}
    steps:
      - name: Wait for CI to pass on this commit
        id: wait
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != push ]; then echo "release=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          for attempt in $(seq 1 60); do
            result=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push" \
              --jq '[.workflow_runs[]] | sort_by(.created_at) | last | if . == null then "none" else "\(.status) \(.conclusion)" end')
            case "$result" in
              "completed success") echo "CI passed on $SHA"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
              "completed cancelled")
                head=$(gh api "repos/$REPO/commits/$BRANCH" --jq .sha)
                if [ "$head" != "$SHA" ]; then
                  echo "::notice::CI on $SHA was cancelled because $BRANCH moved on to $head; that commit's run releases, so this one is skipped"
                  echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
                fi
                echo "::error::CI on $SHA was cancelled and it is still the newest commit on $BRANCH, so nothing is released"; exit 1 ;;
              completed*) echo "::error::CI did not pass on $SHA ($result), so nothing is released"; exit 1 ;;
              *) echo "CI on $SHA: $result (check $attempt of 60)"; sleep 20 ;;
            esac
          done
          echo "::error::CI on $SHA did not finish within 20 minutes, so nothing is released"
          exit 1

  release:
    name: Release
    needs: ci-gate
    if: needs.ci-gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Optional protection: add required reviewers to this environment in the repo settings to gate every publish.
    environment: release
    permissions:
      contents: write # push the version commit and tag, create the GitHub release
      id-token: write # npm trusted publishing (OIDC) and provenance: no npm token is stored anywhere
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # semantic-release reads the whole history and the tags
          persist-credentials: false
      # No dependency cache in this job: a poisoned cache must never reach a publish.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci --ignore-scripts
      # Registry signatures and provenance of everything installed. Only a missing registry key (EMISSINGSIGNATUREKEY,
      # which can last minutes) is retried, for up to 5 minutes; a signature that doesn't match fails at once.
      - name: npm audit signatures
        run: node scripts/audit-signatures.mjs
      # Everything CI checks, on the exact commit being released
      - run: npm run verify
      - run: npm run test:release
      # The tarball that would ship: contents, exports targets, size budget, no credentials
      - run: npm run check:publish
      # ...and it installs and loads under npm, pnpm, yarn, bun and deno
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: corepack enable pnpm
      - run: npm run test:install
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: '0' # no git hooks on the release bot's commit
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npx --no-install semantic-release --dry-run
          else
            npx --no-install semantic-release
          fi
