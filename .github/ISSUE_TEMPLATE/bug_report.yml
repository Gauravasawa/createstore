name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problem? Do not use this form. See SECURITY.md and report it privately.
  - type: input
    id: version
    attributes:
      label: Package version
      description: Output of `npm ls @createstore/createstore`
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node, React and bundler or framework versions (for example Next.js 15), and the browser if relevant
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: The smallest code that shows the problem. A link to a StackBlitz or a repository is ideal.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
